name: Gerar Qelvoriflix Key Admin APK
on:
  push:
    branches: [qelvoriflix-key-admin-2026]
    paths:
      - 'admin-apk/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK administrador
        working-directory: admin-apk
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Qelvoriflix-Key-Admin
          path: admin-apk/app/build/outputs/apk/debug/app-debug.apk
