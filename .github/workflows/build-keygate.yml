name: Compile Qelvoriflix KeyGate
on:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build-keygate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android KeyGate
        run: gradle --no-daemon :app:assembleDebug
      - name: Extract all compiled DEX files
        run: |
          mkdir -p gate-dex
          unzip -j app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' -d gate-dex
          ls -lh gate-dex
          test -f gate-dex/classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: Qelvoriflix-KeyGate-DEX
          path: gate-dex/*.dex
