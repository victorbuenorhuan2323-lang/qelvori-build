name: Compile Qelvoriflix KeyGate
on:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build-keygate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android KeyGate
        run: gradle --no-daemon :app:assembleDebug
      - name: Extract DEX
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes.dex > keygate.dex
          test -s keygate.dex
      - uses: actions/upload-artifact@v4
        with:
          name: Qelvoriflix-KeyGate-DEX
          path: keygate.dex
