name: Compilar DEX de licenças do Qelvoriflix Pro
on:
  push:
    branches: [qelvoriflix-pro-key-rebuild-2026]
    paths:
      - 'keygate-rebuild/**'
      - '.github/workflows/build-license-dex.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-keygate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android tools
        shell: bash
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$BUILD_TOOLS/d8" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Compile Java into DEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes build/dex build/tools
          javac -source 8 -target 8 -encoding UTF-8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/classes \
            keygate-rebuild/com/qelvoriflix/keygate/*.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 21 --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
             --output build/dex $(find build/classes -type f -name '*.class')
          test -s build/dex/classes.dex
          cp build/dex/classes.dex build/tools/classes2.dex
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" build/tools/zipalign
          echo 'Dex compiled for API 21+, replace existing classes2.dex. Sign APK v1/v2/v3 with a developer keystore.' > build/tools/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Qelvoriflix-Pro-License-DEX-And-Tools
          path: build/tools/*
