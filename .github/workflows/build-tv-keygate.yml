name: Build Qelvoriflix TV KeyGate DEX
on:
  push:
    branches: [qelvoriflix-tv-keys-2026]
    paths:
      - 'tv-keys/**'
      - '.github/workflows/build-tv-keygate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android tools
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Compile TV license components
        run: |
          set -euo pipefail
          mkdir -p out/classes out/dex
          javac -source 8 -target 8 -encoding UTF-8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d out/classes tv-keys/com/qelvoriflix/tvkeys/*.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 24 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output out/dex $(find out/classes -name '*.class')
          mv out/dex/classes.dex out/classes3.dex
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" out/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: Qelvoriflix-TV-Keys-Classes
          path: |
            out/classes3.dex
            out/apksigner.jar
            out/zipalign
