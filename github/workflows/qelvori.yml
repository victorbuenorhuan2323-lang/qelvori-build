name: Compilar APK Qelvori
on:
  workflow_dispatch:
    inputs:
      project:
        description: Projeto compactado enviado pelo aplicativo
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar compilador
        run: python3 server/bootstrap.py
      - name: Compilar e assinar
        run: python3 server/github_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Qelvori-APK
          path: github-output/app.apk
          if-no-files-found: error
